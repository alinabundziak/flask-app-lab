{% extends "base.html" %}

{% block content %}
<section class="container py-5">
    <h1>Список товарів</h1>

    <div class="row g-4 mt-3">
        {% for product in products %}
        <div class="col-md-4">
            <div class="product-card">
                <h2>{{ product.name }}</h2>
                <p>Ціна: ${{ product.price }}</p>

                <a href="{{ url_for('products.product_detail', product_id=product.id) }}">
                    Детальніше
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
