
{% extends "base.html" %}

{% block content %}

<section class="container py-5">
    <div class="profile-box">

        <h1>Особистий профіль</h1>

        <h2>Вітаємо, {{ username }}!</h2>

        <p>Ви успішно увійшли до системи.</p>

        <form method="POST" action="{{ url_for('users.logout') }}">
            <button type="submit" class="outline-button">
                Вийти
            </button>
        </form>

    </div>
</section>

{% endblock %}
